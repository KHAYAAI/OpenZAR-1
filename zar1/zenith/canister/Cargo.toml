[package]
name = "zar1_zenith_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = { version = "0.7", default-features = false }
candle-onnx = { version = "0.7", default-features = false }
candle-nn = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
ring = { version = "0.17", default-features = false }
once_cell = "1"
log = "0.4"

# Plonk verifier shim (provided by Zenith runtime)
pallet-zk-verifier = { version = "0.1", optional = true }

[features]
default = ["wasm"]
wasm = []
zk = ["pallet-zk-verifier"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
